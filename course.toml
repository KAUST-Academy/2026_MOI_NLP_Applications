# =============================================================================
# NLP Applications — course content
# Two four-day sessions with KAUST Academy for MOI.
#
# This file is the single source of truth for the website. Edit it, run
# `python3 build.py --check`, and every page is regenerated. Never edit the
# generated HTML in _site/ — it is deleted and rebuilt every time.
#
# Resource `status`:
#   todo   -> renders greyed out as "Coming soon", not linked, not checked.
#   ready  -> renders as a button; `file` must exist or --check fails the build.
# =============================================================================

[course]
title      = "NLP Applications"
title_lead = "NLP"
title_rest = "Applications"

tagline  = "Welcome to the NLP Applications Course. Here you can find all of the slides and labs."
client   = "MOI"
provider = "KAUST Academy"
year     = "2026"

# Not confirmed yet. Add the dates and the venue here (YYYY-MM-DD) once they
# are known.
# starts   = ""
# ends     = ""
# location = ""

# Drives the footer licence link and the Colab URLs below.
repo         = "KAUST-Academy/2026_MOI_NLP_Applications"

license      = "GPL-3.0"
license_note = "Recording and uploading lectures online is not permitted."

summary = """
Two sessions of four days, each day built around lecture decks and hands-on
labs. Day 1 goes from raw text to vectors: the NLP task map, preprocessing and
what makes Arabic hard, counting models, subword tokenizers, and word and
sentence embeddings. Day 2 goes from recurrent networks and attention to the
transformer and its three model families. Day 3 covers how large language
models are built and used, and prompt engineering measured on real tasks.
Day 4 fits a model on the hardware you have, serves it, and fine-tunes it.
"""

# -----------------------------------------------------------------------------
# Days
#
# `session` groups the days on the home page: one heading and row per session.
# Labs are listed in the order they are run. Day 1 Labs 2 and 3 and every
# Day 2 lab download models and data at runtime and need internet. Day 1 Lab 2
# and the Day 2 labs are set up for a GPU (Colab T4).
#
# Colab URLs: https://colab.research.google.com/github/<repo>/blob/main/<path>
# -----------------------------------------------------------------------------

[[days]]
slug    = "day1"
label   = "Day 1"
session = "Session 1"
title   = "NLP Foundations"
blurb   = "From raw text to numbers a program can use: the NLP task map, preprocessing and what makes Arabic hard, counting models, subword tokenizers, and word and sentence embeddings."
icon    = "ri-file-text-line"

  [[days.resources]]
  name   = "Part 1: NLP Tasks, Text and Counting Models"
  detail = "The NLP task map and how each task is scored (accuracy, F1, exact match, ROUGE, BLEU, chrF); the classic preprocessing pipeline; what makes Arabic hard; bag of words and TF-IDF; Naive Bayes and logistic regression classifiers; n-gram language models"
  kind   = "slides"
  file   = "Slides/Day_1/01_NLP_Tasks_and_Text_Processing.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Part 2: Tokenization and Embeddings"
  detail = "Word, character and subword tokens; BPE, WordPiece and Unigram; fertility and the Arabic token premium; one-hot and co-occurrence vectors and cosine similarity; word2vec, GloVe and fastText; contextual and sentence embeddings, semantic search, and choosing an embedding model"
  kind   = "slides"
  file   = "Slides/Day_1/02_Tokenization_and_Embeddings.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Lab 1a: Text Pre-Processing"
  detail = "Tokenize, remove stop words, stem (including Arabic with the ISRI stemmer) and lemmatize with NLTK, then tag parts of speech, score sentiment, find named entities, parse dependencies and compare texts with NLTK and spaCy."
  kind   = "lab"
  file   = "Labs/Day_1/01a_Text_Pre_Processing.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_1/01a_Text_Pre_Processing.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 1b: Text Feature Engineering and N-grams"
  detail = "Turn movie reviews into bag-of-words and TF-IDF features, build an n-gram language model, explore the Gutenberg corpus, then train and evaluate a classifier that predicts gender from first names."
  kind   = "lab"
  file   = "Labs/Day_1/01b_Text_Feature_Engineering_N_Grams.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_1/01b_Text_Feature_Engineering_N_Grams.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 2: NLP Tasks and Tokenizers in English and Arabic"
  detail = "Run one model for each output shape (classification, named entities, extractive question answering, translation) on English and Arabic, score two translation systems with chrF, measure the Arabic token premium across six tokenizers, and train your own BPE tokenizers. Needs a Colab T4 GPU."
  kind   = "lab"
  file   = "Labs/Day_1/02_NLP_Tasks_and_Tokenizers.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_1/02_NLP_Tasks_and_Tokenizers.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 3: Semantic Search in a Refinery Manual"
  detail = "Find the right pages of a 50-page refinery guide for a technician's question: averaged GloVe vectors with and without preprocessing, a TF-IDF baseline and sentence embeddings, all scored on the same ground truth, then ask the same questions in Arabic."
  kind   = "lab"
  file   = "Labs/Day_1/03_Semantic_Search_in_a_Refinery_Manual.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_1/03_Semantic_Search_in_a_Refinery_Manual.ipynb"
  status = "ready"

[[days]]
slug    = "day2"
label   = "Day 2"
session = "Session 1"
title   = "Sequence Models and Transformers"
blurb   = "From reading text in order to the transformer: recurrent networks, LSTM and GRU, encoder-decoder models and attention, then self-attention, the transformer block, the encoder, decoder and encoder-decoder families, and fine-tuning a pretrained model."
icon    = "ri-node-tree"

  [[days.resources]]
  name   = "Part 1: Sequence Models and Attention"
  detail = "Why word order and long-range context need a sequence model; recurrent networks worked by hand, input and output shapes, padding and packing, and a review classifier in PyTorch; backpropagation through time, vanishing and exploding gradients, and clipping; LSTM and GRU gates, compared on IMDb; encoder-decoder models, teacher forcing and the bottleneck; attention as a soft lookup with queries, keys and values, self-attention and cross-attention"
  kind   = "slides"
  file   = "Slides/Day_2/01_Sequence_Models_and_Attention.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Part 2: Transformers and Model Families"
  detail = "Self-attention worked by hand and in PyTorch, and why scores are scaled; multi-head attention and the cost of long inputs; sinusoidal and learned position encodings; the transformer block: residual connections, layer normalization, the feed-forward network and parameter counts; causal masking and the decoder; pretraining the three families (BERT and AraBERT, GPT and Qwen, T5 and mBART) and which fits which job; fine-tuning on IMDb with the Trainer, pretrained versus from scratch"
  kind   = "slides"
  file   = "Slides/Day_2/02_Transformers_and_Model_Families.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Lab 1: Classifying Stack Overflow Posts with RNN, LSTM and GRU"
  detail = "Sort Stack Overflow post titles into Spark, machine learning and security: clean and lemmatize the titles, turn them into sequences of GloVe vectors, pad each batch, then train a plain RNN, an LSTM and a GRU in PyTorch and compare them with classification reports and confusion matrices."
  kind   = "lab"
  file   = "Labs/Day_2/01_RNN_LSTM_GRU_Stack_Overflow_Classification.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_2/01_RNN_LSTM_GRU_Stack_Overflow_Classification.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 2: An Attention-Based Sentiment Classifier"
  detail = "Build a vocabulary from IMDb movie reviews, read them with a GRU, put dot-product attention on top and train a positive or negative classifier; then colour each word by its attention weight, chart the words the model attends to most, and try sentences of your own."
  kind   = "lab"
  file   = "Labs/Day_2/02_Attention_Based_Classifier.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_2/02_Attention_Based_Classifier.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 3: Encoder, Decoder or Both for Question Answering"
  detail = "Answer questions about a paragraph three ways: DistilBERT (encoder-only) points at a span, while FLAN-T5 (encoder-decoder) and Qwen3-0.6B (decoder-only) write the answer. Measure which tokens each model lets a token see, compare their inputs, test what happens when the answer is missing or past a 512-token window, and build a mini QA system."
  kind   = "lab"
  file   = "Labs/Day_2/03_Encoder_Decoder_and_Encoder_Decoder_QA.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_2/03_Encoder_Decoder_and_Encoder_Decoder_QA.ipynb"
  status = "ready"

  [[days.resources]]
  name   = "Lab 4: Fine-Tuning a Transformer"
  detail = "Fine-tune pretrained DistilBERT on IMDb reviews with the Hugging Face Trainer, using mixed precision and early stopping; plot the training curves, score all 25,000 test reviews on accuracy, precision, recall and F1, classify sentences of your own, and compare the result with the attention model from Lab 2. Needs a Colab T4 GPU."
  kind   = "lab"
  file   = "Labs/Day_2/04_Transformer_Fine_Tuning.ipynb"
  colab  = "https://colab.research.google.com/github/KAUST-Academy/2026_MOI_NLP_Applications/blob/main/Labs/Day_2/04_Transformer_Fine_Tuning.ipynb"
  status = "ready"

[[days]]
slug    = "day3"
label   = "Day 3"
session = "Session 1"
title   = "Large Language Models and Prompting"
blurb   = "How a large language model is built and used: scale, pretraining data, instruction tuning and alignment, chat templates, decoding, context windows and hallucination, and Arabic-centric LLMs; then prompt engineering measured on real tasks: instructions, examples, reasoning and structured output."
icon    = "ri-chat-3-line"

  [[days.resources]]
  name   = "Part 1: How Large Language Models Are Built and Used"
  detail = "From a pretrained decoder to an assistant: tasks written as text, examples in the prompt, base and chat models; scale, compute by hand and scaling laws; pretraining data from web crawl to clean tokens; instruction tuning and alignment with people's preferences; chat templates; greedy and beam search, temperature, top-k and top-p; the context window and what gets lost in a long input; hallucination; open and closed models, and Arabic-centric LLMs (Jais, ALLaM, Fanar)"
  kind   = "slides"
  file   = "Slides/Day_3/01_How_LLMs_Are_Built_and_Used.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Part 2: Prompt Engineering in Practice"
  detail = "Testing a prompt like code on labelled data; the parts of a prompt, the system message, label definitions, delimiters and personas; zero-shot and few-shot, how many examples and which ones; how small wording changes swing results; chain of thought, self-consistency, thinking mode, self-checking and prompt chaining; valid JSON with Pydantic, retries and constrained decoding; prompts in production, and when prompting is not enough"
  kind   = "slides"
  file   = "Slides/Day_3/02_Prompt_Engineering.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Labs"
  detail = "Hands-on notebooks for the day"
  kind   = "lab"
  status = "todo"

[[days]]
slug    = "day4"
label   = "Day 4"
session = "Session 1"
title   = "Running and Fine-Tuning LLMs"
blurb   = "Fitting a model on the hardware you have and serving it to many users: the KV cache, quantization, mixture of experts, Ollama and vLLM; then adapting it to your task with LoRA and QLoRA, supervised fine-tuning, preference tuning, GRPO and distillation."
icon    = "ri-cpu-line"

  [[days.resources]]
  name   = "Part 1: Fit and Run a Model"
  detail = "What fills GPU memory; prefill and decode; the KV cache computed by hand, and grouped-query attention; quantization by hand and measured, NF4 and the formats you will meet, and what fits on a T4; decoding speed and mixture of experts; prefix caching, streaming and speculative decoding; serving with GGUF files, Ollama and vLLM (continuous batching and PagedAttention); why training needs far more memory than running"
  kind   = "slides"
  file   = "Slides/Day_4/01_Fit_and_Run_a_Model.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Part 2: Fine-Tune It"
  detail = "Prompt, retrieve or fine-tune, and what fine-tuning can and cannot teach; LoRA counted by hand and in code with PEFT; QLoRA on a T4, and Unsloth; supervised fine-tuning with TRL, the loss on the answer, measured before and after; preference tuning with RLHF and DPO; checkable rewards with GRPO, and reward hacking; labels, distillation and synthetic data from a larger model; which method for which goal, then merge, export and serve"
  kind   = "slides"
  file   = "Slides/Day_4/02_Fine_Tune_It.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Labs"
  detail = "Hands-on notebooks for the day"
  kind   = "lab"
  status = "todo"

